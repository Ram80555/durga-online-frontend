<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Durga Online - Prediction Panel</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151a21;
      --text-gold: #ffb400;
      --border: #21262d;
    }
    body { background: var(--bg); color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    
    .header { background: #161b22; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .brand { font-size: 20px; font-weight: bold; color: var(--text-gold); }
    .user-summary { font-size: 13px; font-weight: 600; }
    
    .btn-nav { background: #21262d; color: #fff; border: 1px solid #30363d; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 5px; }
    .btn-logout { background: #da3633; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; margin-left: 8px; }

    .container { padding: 15px; max-width: 1000px; margin: 0 auto; }

    .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .res-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
    .res-title { font-size: 13px; font-weight: bold; color: #8b949e; margin-bottom: 6px; }
    .res-box-row { display: flex; justify-content: center; gap: 8px; margin: 6px 0; }
    .res-box { background: #0d1117; border: 1px solid var(--text-gold); color: var(--text-gold); border-radius: 4px; padding: 6px 10px; font-size: 16px; font-weight: bold; flex: 1; }
    .res-box small { display: block; font-size: 9px; color: #8b949e; text-transform: uppercase; }
    .res-timer { font-size: 11px; color: #3fb950; font-weight: bold; margin-top: 4px; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .market-row { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
    .market-row:hover { border-color: var(--text-gold); }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .status-open { background: #1b4721; color: #4ade80; }
    .status-closed { background: #451a1a; color: #f87171; }

    .odds-box { display: flex; gap: 10px; margin-top: 10px; }
    .mode-box { flex: 1; padding: 12px; border-radius: 6px; text-align: center; cursor: pointer; border: 1px solid var(--border); background: #0d1117; font-weight: bold; font-size: 13px; }
    .mode-box.selected { border-color: var(--text-gold); background: #21262d; color: var(--text-gold); }

    input { width: 100%; padding: 10px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 4px; box-sizing: border-box; }
    .btn-submit { width: 100%; padding: 12px; background: #238636; border: none; font-weight: bold; color: white; border-radius: 4px; cursor: pointer; margin-top: 10px; }

    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:999; }
    .modal-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { border: 1px solid var(--border); padding: 8px; text-align: center; }
    th { background: #161b22; color: var(--text-gold); }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">DURGA ONLINE</div>
    <div class="user-summary">
      <span><strong id="uName">---</strong></span> | 
      <span style="color:#2ebd49;">Bal: <strong id="bal">0</strong> C</span> | 
      <span style="color:#ffb400;">Exp: <strong id="exp">0</strong> C</span>
      <button class="btn-nav" onclick="openPendingBets()">Pending Bets</button>
      <button class="btn-nav" onclick="openStatement()">Statement</button>
      <button class="btn-logout" onclick="clientLogout()">Logout</button>
    </div>
  </div>

  <div class="container">

    <h4 style="color:var(--text-gold); margin-bottom: 10px;">LATEST MARKET CLOSING RESULTS</h4>
    <div class="results-grid" id="resultsContainer">
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Select Market Index</h3>
      <div id="marketListContainer">Loading Markets...</div>
    </div>

    <div class="card" id="betSection" style="display:none;">
      <h3 id="selectedMarketTitle">Place Prediction</h3>
      <div class="odds-box">
        <div class="mode-box selected" id="singleMode" onclick="setMode('single')">Single Digit<br><small style="color:#ffb400;">Payout 1 : 9</small></div>
        <div class="mode-box" id="doubleMode" onclick="setMode('double')">Double Digit<br><small style="color:#8b949e;">Payout 1 : 80</small></div>
      </div>
      <div style="margin-top: 15px;">
        <p style="font-size: 13px;">Selected Mode: <strong id="currentMode" style="color: var(--text-gold);">Single Digit (1:9)</strong></p>
        <input type="text" id="digitInput" placeholder="Enter Digit (0-9 for Single, 00-99 for Double)">
        <input type="number" id="coinInput" placeholder="Enter Amount of Coins">
        <button class="btn-submit" id="betBtn" onclick="placeBet()">PLACE PREDICTION</button>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="modalTitle" style="color:var(--text-gold); margin:0;">Title</h3>
        <button onclick="closeModal()" style="background:#da3633; color:#fff; border:none; padding:4px 10px; border-radius:4px; cursor:pointer;">X</button>
      </div>
      <div id="modalBody" style="margin-top:15px;"></div>
    </div>
  </div>

  <script>
    const MARKETS_CONFIG = [
      { name: 'KOSPI', lockTime: '11:30', unlockTime: '12:00', resultTime: '11:52' },
      { name: 'HANG SENG', lockTime: '13:15', unlockTime: '13:45', resultTime: '13:32' },
      { name: 'SENSEX', lockTime: '15:00', unlockTime: '15:30', resultTime: '15:32' },
      { name: 'DAX', lockTime: '21:30', unlockTime: '22:00', resultTime: '22:02' },
      { name: 'DOW JONES', lockTime: '01:30', unlockTime: '02:00', resultTime: '01:32' }
    ];

    let activeMarket = '';
    let activeMode = 'single';
    const BACKEND_URL = 'https://durga-online-backend.onrender.com';
    let userSession = JSON.parse(localStorage.getItem('durgaUser'));

    if(!userSession) { window.location.href = 'login.html'; }

    function clientLogout() {
      localStorage.removeItem('durgaUser');
      window.location.href = 'login.html';
    }

    async function verifyDeviceSession() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/auth/verify-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: userSession.username, sessionToken: userSession.sessionToken })
        });
        const data = await res.json();
        if (!data.valid) {
          alert('Logged out! Account logged in from another device.');
          clientLogout();
          return;
        }
        userSession.balance = data.balance || 0;
        userSession.exposure = data.exposure || 0;
        document.getElementById('uName').innerText = userSession.username;
        document.getElementById('bal').innerText = userSession.balance;
        document.getElementById('exp').innerText = userSession.exposure;
      } catch (err) {}
    }

    function isMarketLocked(m) {
      const now = new Date();
      const istOffset = 5.5 * 60 * 60 * 1000;
      const istTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + istOffset);
      const curMins = istTime.getHours() * 60 + istTime.getMinutes();

      const [lockH, lockM] = m.lockTime.split(':').map(Number);
      const lockMins = lockH * 60 + lockM;

      const [unH, unM] = m.unlockTime.split(':').map(Number);
      const unlockMins = unH * 60 + unM;

      if (lockMins < unlockMins) {
        return curMins >= lockMins && curMins < unlockMins;
      } else {
        return curMins >= lockMins || curMins < unlockMins;
      }
    }

    async function fetchResults() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/market/results`);
        const results = await res.json();
        const resMap = {};
        if (Array.isArray(results)) {
          results.forEach(r => resMap[r.market] = r);
        }

        let html = '';
        MARKETS_CONFIG.forEach(m => {
          const r = resMap[m.name] || { singleDigit: '-', doubleDigit: '--' };
          html += `
            <div class="res-card">
              <div class="res-title">${m.name}</div>
              <div class="res-box-row">
                <div class="res-box"><small>Single</small>${r.singleDigit}</div>
                <div class="res-box"><small>Double</small>${r.doubleDigit}</div>
              </div>
              <div class="res-timer" id="timer-${m.name.replace(/\s+/g, '')}">Settle in --:--:--</div>
            </div>
          `;
        });
        document.getElementById('resultsContainer').innerHTML = html;
        updateTimers();
      } catch(e){}
    }

    function updateTimers() {
      const now = new Date();
      const istOffset = 5.5 * 60 * 60 * 1000;
      const istTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + istOffset);

      MARKETS_CONFIG.forEach(m => {
        const [resH, resM] = m.resultTime.split(':').map(Number);
        let target = new Date(istTime);
        target.setHours(resH, resM, 0, 0);
        if (istTime > target) { target.setDate(target.getDate() + 1); }

        const diff = target - istTime;
        const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
        const min = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
        const sec = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');

        const el = document.getElementById(`timer-${m.name.replace(/\s+/g, '')}`);
        if(el) el.innerText = `Settle in -${h}:${min}:${sec}`;
      });
    }

    function renderMarketsList() {
      let html = '';
      MARKETS_CONFIG.forEach(m => {
        const locked = isMarketLocked(m);
        const statusClass = locked ? 'status-closed' : 'status-open';
        const statusText = locked ? 'BET LOCKED (NEXT RESULT)' : 'BET OPEN';

        html += `
          <div class="market-row" onclick="${locked ? `alert('Betting Locked for ${m.name} till ${m.unlockTime}')` : `selectMarket('${m.name}')`}">
            <div>
              <strong>${m.name}</strong>
              <small style="display:block; color:#8b949e;">Settle Time: ${m.resultTime} IST (+2 min Close)</small>
            </div>
            <div>
              <span class="status-badge ${statusClass}">${statusText}</span>
            </div>
          </div>
        `;
      });
      document.getElementById('marketListContainer').innerHTML = html;
    }

    function selectMarket(market) {
      activeMarket = market;
      document.getElementById('selectedMarketTitle').innerText = market + ' Prediction Panel';
      document.getElementById('betSection').style.display = 'block';
    }

    function setMode(mode) {
      activeMode = mode;
      document.getElementById('currentMode').innerText = mode === 'single' ? 'Single Digit (1:9)' : 'Double Digit (1:80)';
      document.getElementById('singleMode').classList.toggle('selected', mode === 'single');
      document.getElementById('doubleMode').classList.toggle('selected', mode === 'double');
    }

    async function placeBet() {
      const digit = document.getElementById('digitInput').value.trim();
      const coins = Number(document.getElementById('coinInput').value);
      const btn = document.getElementById('betBtn');

      if (!digit || !coins || activeMarket === '') return alert('Enter digit and amount');

      if (activeMode === 'single' && (digit.length !== 1 || isNaN(digit))) return alert('Enter 1 Single Digit (0-9)');
      if (activeMode === 'double' && (digit.length !== 2 || isNaN(digit))) return alert('Enter 2 Double Digits (00-99)');

      if (userSession.balance < coins) return alert('Insufficient Balance!');

      btn.disabled = true;
      btn.innerText = 'PLACING PREDICTION...';

      try {
        const res = await fetch(`${BACKEND_URL}/api/client/place-bet`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: userSession.username,
            userId: userSession._id || userSession.username,
            market: activeMarket,
            type: activeMode,
            selectedDigit: digit,
            coins: coins
          })
        });
        
        const data = await res.json();
        if(res.ok) {
          alert(`Prediction Placed Successfully! ${coins} Coins deducted.`);
          document.getElementById('digitInput').value = '';
          document.getElementById('coinInput').value = '';
          verifyDeviceSession();
        } else {
          alert(data.msg || data.message || 'Error placing bet');
        }
      } catch (err) { alert('Server response error. Please try again.'); }
      finally {
        btn.disabled = false;
        btn.innerText = 'PLACE PREDICTION';
      }
    }

    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

    async function openPendingBets() {
      document.getElementById('modalTitle').innerText = 'My Pending Predictions';
      document.getElementById('modalBody').innerHTML = 'Loading bets...';
      document.getElementById('modalOverlay').style.display = 'flex';

      try {
        const res = await fetch(`${BACKEND_URL}/api/client/pending-bets/${userSession.username}`);
        const bets = await res.json();

        if (Array.isArray(bets) && bets.length > 0) {
          let html = `<table><thead><tr><th>Date & Time</th><th>Market</th><th>Type</th><th>Digit</th><th>Coins</th></tr></thead><tbody>`;
          bets.forEach(b => {
            const dateStr = new Date(b.createdAt).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
            html += `<tr><td>${dateStr}</td><td><strong>${b.market}</strong></td><td>${b.type.toUpperCase()}</td><td><strong style="color:var(--text-gold);">${b.digit}</strong></td><td>${b.coins} C</td></tr>`;
          });
          html += `</tbody></table>`;
          document.getElementById('modalBody').innerHTML = html;
        } else {
          document.getElementById('modalBody').innerHTML = '<p style="text-align:center; color:#8b949e;">No pending predictions found.</p>';
        }
      } catch (e) { document.getElementById('modalBody').innerHTML = 'Error loading bets.'; }
    }

    async function openStatement() {
      document.getElementById('modalTitle').innerText = 'My Account Statement History';
      document.getElementById('modalBody').innerHTML = 'Loading statement...';
      document.getElementById('modalOverlay').style.display = 'flex';

      try {
        const res = await fetch(`${BACKEND_URL}/api/client/statements/${userSession.username}`);
        const logs = await res.json();

        if (Array.isArray(logs) && logs.length > 0) {
          let html = `<table><thead><tr><th>Date & Time</th><th>Type</th><th>Coins</th><th>Remark</th></tr></thead><tbody>`;
          logs.forEach(l => {
            const dateStr = new Date(l.timestamp).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
            html += `<tr><td>${dateStr}</td><td><strong>${l.type}</strong></td><td>${l.coins} C</td><td style="color:#8b949e;">${l.remark}</td></tr>`;
          });
          html += `</tbody></table>`;
          document.getElementById('modalBody').innerHTML = html;
        } else {
          document.getElementById('modalBody').innerHTML = '<p style="text-align:center; color:#8b949e;">No statement entries found.</p>';
        }
      } catch (e) { document.getElementById('modalBody').innerHTML = 'Error loading statement.'; }
    }

    verifyDeviceSession();
    setInterval(verifyDeviceSession, 3000);
    fetchResults();
    setInterval(fetchResults, 10000);
    setInterval(updateTimers, 1000);
    renderMarketsList();
    setInterval(renderMarketsList, 15000);
  </script>
</body>
</html>
