<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Durga Online - Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #121212; font-family: sans-serif; margin: 0; }
    .login-card { width: 100%; max-width: 380px; padding: 25px; background: #1e1e1e; border-radius: 8px; border: 1px solid #333; color: white; box-sizing: border-box; }
    input { width: 100%; padding: 12px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
    .btn-submit { width: 100%; padding: 12px; background: #28a745; border: none; font-weight: bold; color: white; border-radius: 4px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2 style="text-align: center; color: #ffb400; margin-bottom: 20px;">DURGA ONLINE</h2>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">
    <button class="btn-submit" onclick="handleLogin()">LOGIN</button>
  </div>

  <script>
    const BACKEND_URL = 'https://durga-online-backend.onrender.com';

    async function handleLogin() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value.trim();
      if (!username || !password) return alert('Enter credentials');

      // 1. ADMIN DIRECT OVERRIDE
      if (username === 'Vikram16' && (password === 'Rajput8932@' || password === 'Rajput8932')) {
        sessionStorage.setItem('durgaAdminLoggedIn', 'true');
        window.location.href = 'admin.html';
        return;
      }

      // 2. LOCAL CLIENTS CHECK (Instant Login for Admin Created Users)
      const localClients = JSON.parse(localStorage.getItem('durga_clients_local') || '[]');
      const matchedUser = localClients.find(c => c.username.toLowerCase() === username.toLowerCase() && c.password === password);

      if (matchedUser) {
        if (matchedUser.isLocked) return alert('Your account is LOCKED by Admin.');
        localStorage.setItem('durgaUser', JSON.stringify({
          _id: matchedUser.username,
          username: matchedUser.username,
          role: 'client',
          balance: matchedUser.balance || 0
        }));
        window.location.href = 'index.html';
        return;
      }

      // 3. SERVER DATABASE CHECK (FALLBACK)
      try {
        const res = await fetch(`${BACKEND_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          localStorage.setItem('durgaUser', JSON.stringify(data.user));
          if (data.user && data.user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        } else {
          alert(data.msg || data.message || 'Invalid Username or Password!');
        }
      } catch (err) { 
        alert('Invalid Username or Password!'); 
      }
    }
  </script>
</body>
</html>
