<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Durga Online - User Login</title>
  <style>
    :root {
      --bg: #090c10;
      --card-bg: #151a21;
      --card-border: #21262d;
      --text-gold: #ffb400;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .login-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 30px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }
    .brand-title {
      color: var(--text-gold);
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .sub-title {
      color: #8b949e;
      font-size: 13px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--text-gold); }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #238636;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 5px;
    }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      color: #f85149;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="brand-title">DURGA ONLINE</div>
    <div class="sub-title">Client Prediction Portal</div>
    
    <input type="text" id="usernameInput" placeholder="Enter Username" autocomplete="username">
    <input type="password" id="passwordInput" placeholder="Enter Password" autocomplete="current-password">
    
    <button class="btn-login" id="loginBtn" onclick="handleClientLogin()">LOGIN</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <script>
    const BACKEND_URL = 'https://durga-online-backend.onrender.com';

    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleClientLogin();
    });

    async function handleClientLogin() {
      const uInput = document.getElementById('usernameInput');
      const pInput = document.getElementById('passwordInput');
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');

      const username = uInput.value.trim();
      const password = pInput.value.trim();

      if (!username || !password) {
        err.innerText = 'Please enter both Username and Password!';
        err.style.display = 'block';
        return;
      }

      err.style.display = 'none';
      btn.disabled = true;
      btn.innerText = 'LOGGING IN...';

      try {
        const res = await fetch(`${BACKEND_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.user) {
          // Reject if Admin tries to login here
          if (data.user.role === 'admin' || data.user.role === 'superadmin' || data.user.username.toLowerCase() === 'vikram16') {
            err.innerText = 'Access Denied: Admins must login from the Admin Portal!';
            err.style.display = 'block';
            btn.disabled = false;
            btn.innerText = 'LOGIN';
            return;
          }

          localStorage.setItem('durgaUser', JSON.stringify(data.user));
          window.location.href = 'index.html';
        } else {
          err.innerText = data.msg || 'Invalid Username or Password!';
          err.style.display = 'block';
          btn.disabled = false;
          btn.innerText = 'LOGIN';
        }
      } catch (e) {
        err.innerText = 'Server error. Please try again.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'LOGIN';
      }
    }
  </script>
</body>
</html>
